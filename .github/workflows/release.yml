name: Release

# A release is cut locally with `bun run release` (bumps every version file,
# updates CHANGELOG.md, commits, and tags `vX.Y.Z`). Pushing that tag is what
# starts this workflow: it builds the installers and publishes the GitHub
# Release. The tag is the single source of the version — nothing here edits it.
on:
  push:
    tags:
      - 'v*'

# One build per tag. A manual re-run of a failed job reuses the same ref, so no
# `workflow_dispatch` input is needed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      # tauri-action creates the Release and uploads the installers to it.
      contents: write

    strategy:
      # Never let one platform's failure cancel the others; a partial release is
      # still better than none, and a re-run only rebuilds what failed.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon host; builds both Mac targets.
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # 22.04 (not `-latest`) for the wider glibc/webkit baseline a Linux
          # installer should target.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs these; without them the build script (not our
      # code) fails. Mirrors the CI workflow.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS entries cross-compile; the others use the host target.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tauri.<os>.conf.json` lists the ONNX Runtime library under
      # `bundle.resources`, and `tauri-build` aborts when a listed resource is
      # absent. `tauri-action` runs the `beforeBuildCommand` (which calls this)
      # anyway, but doing it up front keeps a missing download visible as its
      # own failed step rather than a confusing bundling error.
      #
      # Caveat: the script fetches the *host* build, so the Intel macOS bundle
      # carries an arm64 dylib. The local embedder reports the model unavailable
      # there (#D17) — a graceful, documented degradation, not a crash.
      - name: Install the ONNX Runtime library
        run: bun run setup:onnx

      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StyleNotes ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
