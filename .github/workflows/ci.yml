name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tauri (and its `glib-sys`/`webkit2gtk-sys` build scripts) needs these
      # system libraries on Linux; without them `clippy` fails in the build
      # script, not in our code. See https://v2.tauri.app/start/prerequisites/
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Typecheck (app)
        run: bun run check

      - name: Typecheck (shared)
        run: bun run check:shared

      - name: Unit tests
        run: bun run test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's build script requires the `bundle.externalBin` file to exist
      # (`stylenotes-mcp-<triple>`) or it aborts the build. Produce it exactly as
      # `beforeBuildCommand` does, before anything compiles the app crate.
      - name: Build the MCP sidecar
        run: bun run mcp:sidecar

      - name: Rust format
        run: bun run fmt:check

      - name: Rust clippy
        run: bun run clippy
