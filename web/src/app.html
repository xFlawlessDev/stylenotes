<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo.png" />
		<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
		<!--
			Theme is mirrored before paint so the page never flashes the wrong
			mode. This is the one exception to "no localStorage for app data":
			it is a display preference, not content.
		-->
		<script>
			try {
				const saved = localStorage.getItem('stylenotes.theme.v1');
				const mode = saved === 'light' ? 'light' : 'dark';
				document.documentElement.classList.remove('light', 'dark');
				document.documentElement.classList.add(mode);
			} catch {
				/* keep the dark default */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
