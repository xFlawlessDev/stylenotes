[package]
name = "stylenotes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate has two binaries (the app and the MCP shim), so `cargo run` — which
# `tauri dev` invokes — must be told which one is the app. Without this it fails
# with "could not determine which binary to run".
default-run = "stylenotes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stylenotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The local MCP server: a plain stdin/stdout JSON-RPC shim, bundled beside the
# app via `bundle.externalBin` (docs/design/mcp-local-free.md #D1, #D12).
[[bin]]
name = "stylenotes-mcp"
path = "src/mcp/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# AI assistant gateway (BYOK): streaming HTTP client + credential encryption.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-desktop-underlay = "0.2.1"
