[package]
name = "stylenotes"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0-only"
# The app is the only binary; the MCP server runs in-process behind the remote
# HTTP listener in `src/remote_mcp/`, so there is no sidecar to build.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stylenotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Local ONNX embedder (docs/design/constella-features.md #D3).
#
# On by default so an ordinary desktop build ships the offline model path, as
# the design intends. `--no-default-features` drops ONNX Runtime and the
# tokenizer entirely for a fast CI check that never needs a model.
#
# The dylib is loaded at runtime (`load-dynamic`), so even when this is on, a
# build without `onnxruntime.dll` still starts and simply reports the model as
# unavailable rather than failing to launch.
default = ["local-embed"]
local-embed = ["dep:ort", "dep:tokenizers"]

[dependencies]
# `macos-private-api` is required for the transparent overlay window on macOS
# (`app.macOSPrivateApi` in tauri.conf.json); `tauri-build` keeps this list and
# that config flag in lockstep. The feature is a no-op off macOS.
#
# Held on the 2.11 line: tauri 2.12 pulls webview2-com 0.39, while the
# debug-only `tauri-plugin-mcp-bridge` 0.13 still binds webview2-com 0.38, so
# clippy/build fail on Windows with a type mismatch until the bridge updates.
tauri = { version = "~2.11.6", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "5"
# In-app updates: signed manifest from GitHub Releases + relaunch after install.
# 2.12 supports tauri ^2.10, so it stays compatible with the 2.11 pin above;
# 2.13 would require tauri ^2.12 and reintroduce the webview2 conflict.
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
# Direct sqlx access for the note+tag write transaction. The plugin keeps its
# own pool private, so atomic multi-statement writes need our own connection.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# AI assistant gateway (BYOK): streaming HTTP client + credential encryption.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
# OS credential store for the cloud session token (never `localStorage`, never
# plaintext on disk). `keyring` v4 ships native backends: Windows Credential
# Manager, macOS Keychain, and Secret Service on Linux.
keyring = "4"
# MCP Bridge for AI-driven Tauri development (debug builds only). Runs a
# localhost WebSocket so an MCP client can screenshot, inspect the DOM, and
# watch IPC live. Never ships in release: registered under `debug_assertions`.
tauri-plugin-mcp-bridge = "0.13"
# Filesystem watcher: pushes new MCP job files to the parked `mcp_wait_job`
# call instead of letting the frontend poll `mcp/jobs/` (src/mcp_watch.rs).
notify = "8"
# Remote MCP HTTP listener (#D12). Minimal hyper server on the tokio runtime Tauri
# already provides; no full web framework is needed for one JSON-RPC POST route.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"] }
# Vendored ONNX Runtime bindings + tokenizer, gated by `local-embed`. Pinned
# because `ort` 2.0 is still a release candidate; a floating requirement could
# pull an incompatible API. `load-dynamic` keeps the dylib out of the link line.
ort = { version = "=2.0.0-rc.12", features = ["ndarray", "load-dynamic"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-desktop-underlay = "0.2.1"
