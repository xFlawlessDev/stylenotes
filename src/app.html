<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StyleNotes</title>
    <script>
      try {
        const raw = localStorage.getItem('stylenotes.theme.v1');
        const saved = raw ? JSON.parse(raw) : null;
        const root = document.documentElement;
        const mode = saved?.mode === 'light' ? 'light' : 'dark';
        root.classList.toggle('dark', mode === 'dark');
        root.classList.toggle('light', mode === 'light');
        if (saved?.accent) root.dataset.accent = saved.accent;
        if (saved?.density) root.dataset.density = saved.density;
        if (saved?.reduceMotion) root.dataset.motion = 'reduced';
      } catch (error) {
        /* keep defaults */
      }
      try {
        const plugins = localStorage.getItem('stylenotes.plugins.v1');
        if (plugins) {
          const style = document.createElement('style');
          style.id = 'stylenotes-ui-plugins';
          style.textContent = plugins;
          document.head.appendChild(style);
        }
      } catch (error) {
        /* keep defaults */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground overflow-hidden">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
